<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 950" width="1190" height="950" role="img" aria-label="Wiring diagram: Arduino Uno connected to a DS3231 clock over I2C, a DFPlayer Mini over serial on pins 11 and 12, and a 16-channel relay module driven from pins 2 to 6, 8 to 10 and 13">
<style>
  .bg{fill:#ffffff}
  .tx{fill:#1d2433;font:13px system-ui,-apple-system,"Segoe UI",sans-serif}
  .note{font-size:12px}
  .mut{fill:#5b6578;font:11.5px system-ui,-apple-system,"Segoe UI",sans-serif}
  .h1{fill:#1d2433;font:700 20px system-ui,-apple-system,"Segoe UI",sans-serif}
  .h2{fill:#1d2433;font:600 13.5px system-ui,-apple-system,"Segoe UI",sans-serif}
  .mono{fill:#1d2433;font:12px ui-monospace,Menlo,Consolas,monospace}
  .net{fill:#5b6578}
  .faint{fill:#9aa3b5;stroke:none}
  .wl{font:600 11.5px system-ui,-apple-system,sans-serif}
  .wl.i2c{fill:#1f5fbf}.wl.ser{fill:#157a34}.wl.rly{fill:#b4500a}.wl.pwr{fill:#7a45c9}
  .bd{fill:#f1f4f9;stroke:#3a4660;stroke-width:1.6}
  .sd{fill:#e3e8f1;stroke:#3a4660;stroke-width:1}
  .dash{stroke-dasharray:6 4}
  .pin{fill:#1d2433}
  .w{fill:none;stroke-width:2.4;stroke-linecap:round}
  .w-i2c{stroke:#1f5fbf}.w-ser{stroke:#157a34}.w-rly{stroke:#b4500a}.w-12{stroke:#7a45c9}
  .w-5v{stroke:#c4262e}.w-gnd{stroke:#1d2433}.w-net{stroke:#5b6578;stroke-width:1.6}
  .w-aud{stroke:#3a4660}
  .faint-line{stroke:#c9d0de;stroke-width:1}
  .w-lamp{stroke:#7a45c9;stroke-width:2;fill:none}
  .mk-ser{fill:#157a34}.mk-rly{fill:#b4500a}.mk-pwr{fill:#7a45c9}
</style>
<rect class="bg" width="1190" height="950"/>
<title>Menorah controller wiring diagram</title>
<defs><marker id="ar-ser" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mk-ser"/></marker><marker id="ar-rly" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mk-rly"/></marker><marker id="ar-pwr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mk-pwr"/></marker></defs>
<text x="30" y="34" class="h1">Menorah controller wiring</text>
<text x="30" y="54" class="mut">Pin numbers are the ones in the sketch. Dashed items are not confirmed yet.</text>
<text x="80" y="100" class="h2">DS3231 real-time clock</text>
<rect x="80" y="108" width="210" height="130" rx="6" class="bd" />
<text x="92" y="128" class="mut">I²C, address 0x68</text>
<text x="278" y="144" class="mono" text-anchor="end">SCL</text>
<text x="278" y="174" class="mono" text-anchor="end">SDA</text>
<text x="92" y="194" class="mono">VCC</text>
<text x="92" y="219" class="mono">GND</text>
<circle cx="290" cy="140" r="3.5" class="pin"/>
<circle cx="290" cy="170" r="3.5" class="pin"/>
<line x1="64" y1="190" x2="80" y2="190" class="w w-net" />
<circle cx="80" cy="190" r="3.5" class="pin"/>
<text x="60" y="194" class="mono net" text-anchor="end">5 V</text>
<line x1="64" y1="215" x2="80" y2="215" class="w w-net" />
<circle cx="80" cy="215" r="3.5" class="pin"/>
<text x="60" y="219" class="mono net" text-anchor="end">GND</text>
<text x="80" y="290" class="h2">DFPlayer Mini (MP3 + SD)</text>
<rect x="80" y="298" width="210" height="220" rx="6" class="bd" />
<text x="278" y="344" class="mono" text-anchor="end">TX</text>
<text x="278" y="384" class="mono" text-anchor="end">RX</text>
<circle cx="290" cy="340" r="3.5" class="pin"/>
<circle cx="290" cy="380" r="3.5" class="pin"/>
<text x="92" y="424" class="mono">VCC</text>
<text x="92" y="449" class="mono">GND</text>
<line x1="64" y1="420" x2="80" y2="420" class="w w-net" />
<circle cx="80" cy="420" r="3.5" class="pin"/>
<text x="60" y="424" class="mono net" text-anchor="end">5 V</text>
<line x1="64" y1="445" x2="80" y2="445" class="w w-net" />
<circle cx="80" cy="445" r="3.5" class="pin"/>
<text x="60" y="449" class="mono net" text-anchor="end">GND</text>
<text x="170" y="508" class="mono" text-anchor="middle">SPK_1</text>
<text x="230" y="508" class="mono" text-anchor="middle">SPK_2</text>
<circle cx="170" cy="518" r="3.5" class="pin"/>
<circle cx="230" cy="518" r="3.5" class="pin"/>
<rect x="96" y="466" width="178" height="26" rx="4" class="sd" />
<text x="185" y="483" class="tx" text-anchor="middle">microSD, FAT32</text>
<line x1="170" y1="518" x2="170" y2="562" class="w w-aud" />
<line x1="230" y1="518" x2="230" y2="562" class="w w-aud" />
<path d="M165,562 h70 v8 h-70 z" class="bd"/><path d="M170,570 l-14,18 h88 l-14,-18 z" class="bd"/>
<text x="185" y="610" class="tx" text-anchor="middle">Speaker</text>
<text x="185" y="626" class="mut" text-anchor="middle">(or amplifier input)</text>
<text x="440" y="100" class="h2">Arduino Uno R3</text>
<rect x="440" y="108" width="220" height="432" rx="6" class="bd" />
<circle cx="440" cy="140" r="3.5" class="pin"/>
<text x="452" y="144" class="mono">A5 (SCL)</text>
<circle cx="440" cy="170" r="3.5" class="pin"/>
<text x="452" y="174" class="mono">A4 (SDA)</text>
<circle cx="440" cy="340" r="3.5" class="pin"/>
<text x="452" y="344" class="mono">D12 (RX)</text>
<circle cx="440" cy="380" r="3.5" class="pin"/>
<text x="452" y="384" class="mono">D11 (TX)</text>
<text x="452" y="496" class="mut">USB ⇄ PC: serial monitor, 9600 baud</text>
<text x="452" y="512" class="mut">(D0/D1 are reserved for USB)</text>
<circle cx="660" cy="140" r="3.5" class="pin"/>
<text x="648" y="144" class="mono" text-anchor="end">D2</text>
<circle cx="660" cy="176" r="3.5" class="pin"/>
<text x="648" y="180" class="mono" text-anchor="end">D3</text>
<circle cx="660" cy="212" r="3.5" class="pin"/>
<text x="648" y="216" class="mono" text-anchor="end">D4</text>
<circle cx="660" cy="248" r="3.5" class="pin"/>
<text x="648" y="252" class="mono" text-anchor="end">D5</text>
<circle cx="660" cy="284" r="3.5" class="pin"/>
<text x="648" y="288" class="mono" text-anchor="end">D6</text>
<circle cx="660" cy="320" r="3.5" class="pin"/>
<text x="648" y="324" class="mono" text-anchor="end">D8</text>
<circle cx="660" cy="356" r="3.5" class="pin"/>
<text x="648" y="360" class="mono" text-anchor="end">D9</text>
<circle cx="660" cy="392" r="3.5" class="pin"/>
<text x="648" y="396" class="mono" text-anchor="end">D10</text>
<circle cx="660" cy="428" r="3.5" class="pin"/>
<text x="648" y="432" class="mono" text-anchor="end">D13</text>
<line x1="500" y1="540" x2="500" y2="556" class="w w-net" />
<circle cx="500" cy="540" r="3.5" class="pin"/>
<text x="500" y="570" class="mono net" text-anchor="middle">5 V</text>
<line x1="540" y1="540" x2="540" y2="556" class="w w-net" />
<circle cx="540" cy="540" r="3.5" class="pin"/>
<text x="540" y="570" class="mono net" text-anchor="middle">GND</text>
<line x1="620" y1="108" x2="620" y2="82" class="w w-12"/>
<circle cx="620" cy="108" r="3.5" class="pin"/>
<text x="606" y="78" class="mono net" text-anchor="end">VIN</text>
<text x="780" y="100" class="h2">Relay module, 16-ch</text>
<rect x="780" y="108" width="180" height="432" rx="6" class="bd" />
<circle cx="780" cy="140" r="3.5" class="pin"/>
<text x="792" y="144" class="tx">Candle 8</text>
<circle cx="780" cy="176" r="3.5" class="pin"/>
<text x="792" y="180" class="tx">Candle 7</text>
<circle cx="780" cy="212" r="3.5" class="pin"/>
<text x="792" y="216" class="tx">Candle 6</text>
<circle cx="780" cy="248" r="3.5" class="pin"/>
<text x="792" y="252" class="tx">Candle 5</text>
<circle cx="780" cy="284" r="3.5" class="pin"/>
<text x="792" y="288" class="tx">Candle 1</text>
<circle cx="780" cy="320" r="3.5" class="pin"/>
<text x="792" y="324" class="tx">Candle 3</text>
<circle cx="780" cy="356" r="3.5" class="pin"/>
<text x="792" y="360" class="tx">Candle 4</text>
<circle cx="780" cy="392" r="3.5" class="pin"/>
<text x="792" y="396" class="tx">Candle 2</text>
<circle cx="780" cy="428" r="3.5" class="pin"/>
<text x="792" y="432" class="tx">Shamash</text>
<text x="792" y="496" class="mut">9 of 16 channels used</text>
<text x="792" y="512" class="mut">Relays are active LOW</text>
<line x1="830" y1="540" x2="830" y2="556" class="w w-net" />
<circle cx="830" cy="540" r="3.5" class="pin"/>
<text x="830" y="570" class="mono net" text-anchor="middle">5 V</text>
<line x1="890" y1="540" x2="890" y2="556" class="w w-net" />
<circle cx="890" cy="540" r="3.5" class="pin"/>
<text x="890" y="570" class="mono net" text-anchor="middle">GND</text>
<line x1="620" y1="82" x2="945" y2="82" class="w w-12"/><line x1="945" y1="108" x2="945" y2="62" class="w w-12"/>
<circle cx="945" cy="108" r="3.5" class="pin"/>
<text x="780" y="76" class="wl pwr" text-anchor="middle">12 V</text>
<text x="945" y="54" class="mono net" text-anchor="middle">12 V from supply</text>
<text x="1000" y="100" class="h2">Load side (each channel)</text>
<rect x="1000" y="108" width="170" height="196" rx="6" class="bd dash" />
<text x="1012" y="132" class="mut">Relay screw terminals</text>
<circle cx="1022" cy="160" r="3.5" class="pin"/>
<text x="1034" y="164" class="mono">COM</text>
<line x1="1062" y1="160" x2="1112" y2="160" class="w w-12" />
<text x="1118" y="164" class="mono net">+12 V</text>
<circle cx="1022" cy="206" r="3.5" class="pin"/>
<text x="1034" y="210" class="mono">NO</text>
<line x1="1052" y1="206" x2="1074" y2="206" class="w w-12" />
<circle cx="1086" cy="206" r="12" class="bd"/>
<path d="M1078,198 l16,16 M1094,198 l-16,16" class="w-lamp"/>
<line x1="1098" y1="206" x2="1112" y2="206" class="w w-12" />
<text x="1118" y="210" class="mono net">−12 V</text>
<circle cx="1022" cy="252" r="3.5" class="pin faint"/>
<text x="1034" y="256" class="mono faint">NC</text>
<text x="1058" y="256" class="mut">unused</text>
<text x="1012" y="284" class="mut">COM–NO closes when the</text>
<text x="1012" y="298" class="mut">input pin goes LOW</text>
<line x1="290" y1="140" x2="440" y2="140" class="w w-i2c" />
<line x1="290" y1="170" x2="440" y2="170" class="w w-i2c" />
<text x="365" y="134" class="wl i2c" text-anchor="middle">SCL clock</text>
<text x="365" y="164" class="wl i2c" text-anchor="middle">SDA data</text>
<line x1="290" y1="340" x2="440" y2="340" class="w w-ser" marker-end="url(#ar-ser)"/>
<text x="365" y="334" class="wl ser" text-anchor="middle">TX → D12</text>
<line x1="440" y1="380" x2="290" y2="380" class="w w-ser" marker-end="url(#ar-ser)"/>
<text x="365" y="374" class="wl ser" text-anchor="middle">D11 → RX</text>
<text x="365" y="402" class="mut" text-anchor="middle">no resistor fitted</text>
<text x="365" y="416" class="mut" text-anchor="middle">(1 kΩ advised)</text>
<line x1="660" y1="140" x2="780" y2="140" class="w w-rly" marker-end="url(#ar-rly)"/>
<line x1="660" y1="176" x2="780" y2="176" class="w w-rly" marker-end="url(#ar-rly)"/>
<line x1="660" y1="212" x2="780" y2="212" class="w w-rly" marker-end="url(#ar-rly)"/>
<line x1="660" y1="248" x2="780" y2="248" class="w w-rly" marker-end="url(#ar-rly)"/>
<line x1="660" y1="284" x2="780" y2="284" class="w w-rly" marker-end="url(#ar-rly)"/>
<line x1="660" y1="320" x2="780" y2="320" class="w w-rly" marker-end="url(#ar-rly)"/>
<line x1="660" y1="356" x2="780" y2="356" class="w w-rly" marker-end="url(#ar-rly)"/>
<line x1="660" y1="392" x2="780" y2="392" class="w w-rly" marker-end="url(#ar-rly)"/>
<line x1="660" y1="428" x2="780" y2="428" class="w w-rly" marker-end="url(#ar-rly)"/>
<text x="720" y="126" class="wl rly" text-anchor="middle">9 control lines</text>
<text x="440" y="600" class="h2">Key</text>
<line x1="440" y1="624" x2="480" y2="624" class="w w-i2c" />
<text x="490" y="628" class="tx">I²C (A4 / A5)</text>
<line x1="440" y1="646" x2="480" y2="646" class="w w-ser" />
<text x="490" y="650" class="tx">Serial to DFPlayer (9600 baud)</text>
<line x1="440" y1="668" x2="480" y2="668" class="w w-rly" />
<text x="490" y="672" class="tx">Relay control, active LOW</text>
<line x1="440" y1="690" x2="480" y2="690" class="w w-12" />
<text x="490" y="694" class="tx">12 V load circuit</text>
<line x1="440" y1="712" x2="480" y2="712" class="w w-12 dash" />
<text x="490" y="716" class="tx">Dashed: not confirmed yet</text>
<text x="780" y="600" class="h2">Notes</text>
<text x="780" y="624" class="tx note">Relay inputs are active LOW: pin LOW = relay on = candle lit.</text>
<text x="780" y="644" class="tx note">Every candle pin is driven HIGH (off) before it becomes an output.</text>
<text x="780" y="664" class="tx note">Candle 2 is on D10 because D7 burnt out on the original Uno.</text>
<text x="780" y="684" class="tx note">Shamash is on D13, which is also the Uno onboard LED.</text>
<text x="780" y="704" class="tx note">The sketch opens SoftwareSerial(rx = 12, tx = 11).</text>
<line x1="30" y1="756" x2="1160" y2="756" class="w faint-line"/>
<text x="30" y="780" class="h2">Power and ground</text>
<rect x="30" y="798" width="150" height="52" rx="6" class="bd" />
<text x="105" y="821" class="tx" text-anchor="middle">12 V DC supply</text>
<text x="105" y="838" class="mut" text-anchor="middle">5 A</text>
<rect x="300" y="798" width="200" height="34" rx="6" class="bd" />
<text x="400" y="820" class="tx" text-anchor="middle">Relay module 12 V input</text>
<line x1="180" y1="815" x2="300" y2="815" class="w w-12" marker-end="url(#ar-pwr)"/>
<text x="240" y="807" class="wl pwr" text-anchor="middle">+12 V</text>
<rect x="590" y="798" width="170" height="34" rx="6" class="bd" />
<text x="675" y="820" class="tx" text-anchor="middle">Uno VIN pin</text>
<line x1="500" y1="815" x2="590" y2="815" class="w w-12" marker-end="url(#ar-pwr)"/>
<text x="545" y="807" class="wl pwr" text-anchor="middle">+12 V</text>
<rect x="590" y="848" width="170" height="34" rx="6" class="bd dash" />
<text x="675" y="870" class="tx" text-anchor="middle">Uno 5 V pin</text>
<line x1="675" y1="832" x2="675" y2="848" class="w w-5v dash" marker-end="url(#ar-pwr)"/>
<text x="684" y="844" class="mut">regulator</text>
<line x1="760" y1="865" x2="800" y2="865" class="w w-5v dash" />
<line x1="800" y1="795" x2="800" y2="875" class="w w-5v dash" />
<line x1="800" y1="795" x2="840" y2="795" class="w w-5v dash" marker-end="url(#ar-pwr)"/>
<text x="848" y="799" class="tx">DS3231 VCC</text>
<line x1="800" y1="835" x2="840" y2="835" class="w w-5v dash" marker-end="url(#ar-pwr)"/>
<text x="848" y="839" class="tx">DFPlayer VCC</text>
<line x1="800" y1="875" x2="840" y2="875" class="w w-5v dash" marker-end="url(#ar-pwr)"/>
<text x="848" y="879" class="tx">Relay module VCC</text>
<line x1="30" y1="910" x2="1160" y2="910" class="w w-gnd dash" />
<text x="30" y="932" class="mut">GND is shared by the supply −, relay module, Uno, DS3231 and DFPlayer. Believed to be one ground; a continuity check would confirm it.</text>
</svg>
